name: CI

# Compila nos três sistemas a cada push e pull request. Mudanças só no site ou em
# documentação não disparam o build.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'brand/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'brand/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app'
          - platform: ubuntu-22.04
            args: '--bundles deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bibliotecas do Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Scripts dos hooks (sintaxe)
        run: |
          node --check hook/island-hook.js
          node --check hook/island-status.js
          node --check install-hooks.js

      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
